<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Flashcards</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <a class="back-link" href="index.html">&#8592; Categorias</a>
    <h1 id="category-title">Flashcards</h1>
    <p class="subtitle" id="category-subtitle"></p>
  </header>

  <main>
    <!-- Contador de progresso -->
    <div class="counter" id="counter">1 / 20</div>

    <!-- Cartão com efeito de flip -->
    <div class="card-container" id="card-container" onclick="flipCard()">
      <div class="card" id="card">
        <div class="card-front">
          <span class="label">Termo</span>
          <h2 id="term">Carregando...</h2>
          <span class="hint">Clique para revelar</span>
        </div>
        <div class="card-back">
          <span class="label">Definição</span>
          <p id="definition">Carregando...</p>
          <span class="hint">Clique para virar</span>
        </div>
      </div>
    </div>

    <!-- Botões de navegação -->
    <div class="controls">
      <button id="btn-prev" onclick="prevCard()">&#8592; Anterior</button>
      <button id="btn-next" onclick="nextCard()">Próximo &#8594;</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
